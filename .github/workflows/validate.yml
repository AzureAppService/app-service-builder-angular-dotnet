name: Validate Angular and ASP.NET Core sample

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: dotnet restore FullstackAngularDotnet.slnx
      - run: npm --prefix web ci
      - run: dotnet test FullstackAngularDotnet.slnx --configuration Release --no-restore
      - run: npm --prefix web run build
      - run: dotnet publish api/FullstackAngularDotnet.Api/FullstackAngularDotnet.Api.csproj --configuration Release --no-restore
      - run: node --test fullstack.test.mjs
      - name: Export exact locked local-validation prerequisite
        if: github.ref == 'refs/heads/sample-ux-refresh' && runner.os == 'Linux'
        run: mkdir .validation-prerequisites && npm pack @angular/router@22.2.5 --pack-destination .validation-prerequisites
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref == 'refs/heads/sample-ux-refresh' && runner.os == 'Linux'
        with:
          name: exact-local-validation-prerequisite
          path: .validation-prerequisites/*
          include-hidden-files: true
          retention-days: 1
