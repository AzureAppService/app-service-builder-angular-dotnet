version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: "nuget"
    directory: "/tests/FullstackAngularDotnet.Api.Tests"
    schedule:
      interval: "weekly"
    groups:
      nuget:
        patterns: ["*"]
