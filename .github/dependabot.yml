version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    ignore:
      # Angular 22.2 requires TypeScript >=6.0 <6.1.
      - dependency-name: "typescript"
        versions: [">=6.1"]
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: "nuget"
    directory: "/tests/FullstackAngularDotnet.Api.Tests"
    schedule:
      interval: "weekly"
    groups:
      nuget:
        patterns: ["*"]
